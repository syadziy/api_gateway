apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
      containers:
        - name: api-gateway
          image: example/api-gateway:1.0.0
          ports:
            - { name: http, containerPort: 9001 }
            - { name: management, containerPort: 9090 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: production }
            - { name: APP_TIMEZONE, value: UTC }
            - { name: TZ, value: UTC }
            - { name: ALERT_SERVICE_URI, value: "http://centralized-alert:9003" }
            - { name: SCHEDULER_SERVICE_URI, value: "http://scheduler:9002" }
            - { name: AUDIT_SERVICE_URI, value: "http://audit-log:9004" }
            - { name: CENTRALIZED_LOG_SERVICE_URI, value: "http://centralized-log:9006" }
            - { name: USERMANAGEMENT_SERVICE_URI, value: "http://usermanagement:9005" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: JWT_ISSUER_URI, value: "http://usermanagement:9005" }
            - { name: JWT_AUDIENCE, value: "api-gateway" }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 9001, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-management
spec:
  type: ClusterIP
  selector: { app: api-gateway }
  ports:
    - { name: management, port: 9090, targetPort: management }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api-gateway }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 70 }
